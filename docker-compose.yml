services:
  next:
    build:
      context: ./next
    container_name: agrorunok-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongodb:27017/agrorunok}
      - NODE_ENV=production
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: agrorunok-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
